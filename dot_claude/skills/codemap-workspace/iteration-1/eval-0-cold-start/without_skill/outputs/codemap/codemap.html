const GROUPS = [
  {key:"frontend", label:"Browser",        color:"var(--frontend)", ids:["web-entry","web-routes","web-components","web-store","web-api"]},
  {key:"edge",     label:"Server edge",    color:"var(--backend)",  ids:["server-main","api-http","auth"]},

  {key:"external", label:"External",       color:"var(--external)", ids:["ext-postgres","ext-nats","ext-redis","ext-oauth","ext-feedback-webhook"]},
];
const NW = 186, NH = 58, COLW = 260, ROWH = 86, TOP = 62, LEFT = 40;

const byId = {};
DATA.nodes.forEach(n => byId[n.id] = n);
const pos = {};
GROUPS.forEach((g, gi) => {
  const known = g.ids.filter(id => byId[id]);
  known.forEach((id, i) => {
    pos[id] = {x: LEFT + gi*COLW, y: TOP + i*ROWH, group:g};
  });
});
// any node not claimed by a group lands in a trailing column
let extraCol = GROUPS.length, extraRow = 0;
DATA.nodes.forEach(n => { if(!pos[n.id]){
  pos[n.id] = {x: LEFT + extraCol*COLW, y: TOP + (extraRow++)*ROWH, group:{label:"Other",color:"var(--muted)"}};
}});

const W = LEFT + (extraCol+1)*COLW, H = TOP + 6*ROWH + 60;

/* ---------------------------------------------------------------- render */
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("svg");
const el = (t, a={}) => { const e = document.createElementNS(NS,t);
  for(const k in a) e.setAttribute(k, a[k]); return e; };

const root = el("g");
svg.appendChild(root);
const gEdges = el("g"); const gNodes = el("g");
root.appendChild(gEdges); root.appendChild(gNodes);

// group headings
GROUPS.forEach((g, gi) => {
  const t = el("text", {x: LEFT + gi*COLW, y: TOP - 26, class:"grouplabel"});
  t.textContent = g.label; root.appendChild(t);
});

function anchor(id, side){
  const p = pos[id];
  return {x: p.x + (side === "out" ? NW : 0), y: p.y + NH/2};
}
function edgePath(e){
  const a = anchor(e.from, "out"), b = anchor(e.to, "in");
  if (pos[e.to].x <= pos[e.from].x){            // backward / same column: loop out
    const mx = Math.max(a.x, b.x) + 54;
    return `M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x + NW},${b.y}`
      .replace(`${b.x + NW},${b.y}`, `${b.x + NW},${b.y}`);
  }
  const dx = (b.x - a.x) * 0.5;
  return `M${a.x},${a.y} C${a.x+dx},${a.y} ${b.x-dx},${b.y} ${b.x},${b.y}`;
}

const edgeEls = DATA.edges.map(e => {
  const unk = e.evidence_status === "unknown";
  const p = el("path", {
    d: edgePath(e), class: "edge" + (unk ? " unk" : ""),
    stroke: unk ? "var(--unknown)" : `var(--${e.type})`,
  });
  p.addEventListener("click", ev => { ev.stopPropagation(); selectEdge(e); });
  p.style.cursor = "pointer";
  gEdges.appendChild(p);
  return {e, p};
});

const nodeEls = DATA.nodes.map(n => {
  const p = pos[n.id];
  const g = el("g", {class:"nodebox", transform:`translate(${p.x},${p.y})`});
  g.appendChild(el("rect", {width:NW, height:NH}));
  const bar = el("rect", {width:4, height:NH, class:"bar", fill:p.group.color, rx:2});
  g.appendChild(bar);
  const t1 = el("text", {x:14, y:23, class:"t"}); t1.textContent = n.id; g.appendChild(t1);
  const t2 = el("text", {x:14, y:41, class:"s"});
  t2.textContent = n.path.length > 30 ? "…" + n.path.slice(-29) : n.path;
  g.appendChild(t2);
  g.addEventListener("click", ev => { ev.stopPropagation(); selectNode(n.id); });
  gNodes.appendChild(g);
  return {n, g};
});

/* ------------------------------------------------------------ pan + zoom */
let vx = 0, vy = 0, vs = 1;
function apply(){ root.setAttribute("transform", `translate(${vx},${vy}) scale(${vs})`); }
function fit(){
  const r = svg.getBoundingClientRect();
  vs = Math.min(r.width / (W + 60), r.height / (H + 40), 1.25);
  vx = 14; vy = 14; apply();
}
window.addEventListener("resize", fit);
svg.addEventListener("wheel", e => {
  e.preventDefault();
  const r = svg.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k = Math.exp(-e.deltaY * 0.0016), ns = Math.min(3, Math.max(0.25, vs * k));
  vx = mx - (mx - vx) * (ns / vs); vy = my - (my - vy) * (ns / vs); vs = ns; apply();
}, {passive:false});
let drag = null;
svg.addEventListener("mousedown", e => { drag = {x:e.clientX, y:e.clientY, vx, vy};
  svg.classList.add("dragging"); });
window.addEventListener("mousemove", e => { if(!drag) return;
  vx = drag.vx + e.clientX - drag.x; vy = drag.vy + e.clientY - drag.y; apply(); });
window.addEventListener("mouseup", () => { drag = null; svg.classList.remove("dragging"); });
svg.addEventListener("click", () => clearSel());
document.getElementById("fit").onclick = fit;
document.getElementById("clear").onclick = clearSel;

  const out = DATA.edges.filter(e => e.from === id), inc = DATA.edges.filter(e => e.to === id);
  const line = e => `<li><span class="pill t-${e.type}${e.evidence_status==="unknown"?" unk":""}">${e.type}</span>
      <code>${esc(e.from === id ? e.to : e.from)}</code>${e.evidence_status==="unknown"?' <span class="hint">(unknown)</span>':""}</li>`;
  const list = (t, a) => a.length ? `<h3>${t}</h3><ul>${a.join("")}</ul>` : "";
  return `<h2>${esc(n.id)}</h2>
    <div class="path mono">${esc(n.path)}</div>
    <p>${esc(n.role)}</p>
    ${list("Entrypoints", n.entrypoints.map(x => `<li><code>${esc(x)}</code></li>`))}
    ${list("Constraints", n.constraints.map(x => `<li>${esc(x)}</li>`))}
    ${n.tests.length ? list("Tests", n.tests.map(x => `<li><code>${esc(x)}</code></li>`))
        : `<h3>Tests</h3><p class="hint">No test files found for this module.</p>`}
    ${list("Outgoing", out.map(line))}
    ${list("Incoming", inc.map(line))}
    <h3>Evidence</h3>${evHtml(n.evidence)}`;
}
function edgeDetail(e){
  return `<h2><code>${esc(e.from)}</code> &rarr; <code>${esc(e.to)}</code></h2>
    <p><span class="pill t-${e.type}${e.evidence_status==="unknown"?" unk":""}">${e.type}</span>
       <span class="pill${e.evidence_status==="unknown"?" unk":""}">${e.evidence_status}</span></p>
    ${e.note ? `<p>${esc(e.note)}</p>` : ""}
    <h3>Evidence</h3>${evHtml(e.evidence)}`;
}

let sel = null;
function paint(){
  const hot = new Set(); const hotEdges = new Set();
  if (sel && sel.k === "node"){
    hot.add(sel.id);
    DATA.edges.forEach((e,i) => { if(e.from===sel.id||e.to===sel.id){
      hotEdges.add(i); hot.add(e.from); hot.add(e.to);} });
  } else if (sel && sel.k === "edge"){
    hotEdges.add(sel.i); hot.add(DATA.edges[sel.i].from); hot.add(DATA.edges[sel.i].to);
  } else if (sel && sel.k === "flow"){
    sel.nodes.forEach(id => hot.add(id));
    DATA.edges.forEach((e,i)=>{ if(hot.has(e.from)&&hot.has(e.to)) hotEdges.add(i); });
  }
  const on = !!sel;
  nodeEls.forEach(({n,g}) => {
    g.classList.toggle("dimmed", on && !hot.has(n.id));
    g.classList.toggle("sel", !!sel && sel.k === "node" && sel.id === n.id);
  });
  edgeEls.forEach(({p}, i) => {
    p.classList.toggle("hot", hotEdges.has(i));
    p.classList.toggle("dimmed", on && !hotEdges.has(i));
  });
}
function selectNode(id){ sel = {k:"node", id}; paint(); showDetail(nodeDetail(id)); }
function selectEdge(e){ sel = {k:"edge", i: DATA.edges.indexOf(e)}; paint(); showDetail(edgeDetail(e)); }
function selectFlow(f){
  sel = {k:"flow", nodes: f.steps.map(s => s.node)}; paint();
  showDetail(`<h2>${esc(f.name)}</h2>
    <h3>Trigger</h3><p>${esc(f.trigger)}</p>
    <h3>Steps</h3>${f.steps.map((s,i)=>`<div class="flowstep"><div class="n">${i+1}</div>
      <div class="b"><b data-go="${esc(s.node)}">${esc(s.node)}</b><div>${esc(s.detail)}</div></div></div>`).join("")}
    <h3>Outcome</h3><p>${esc(f.outcome)}</p>
    <h3>Evidence</h3>${evHtml(f.evidence)}`);
  pane("detail").querySelectorAll("[data-go]").forEach(b => {
    b.style.cursor = "pointer";
    b.onclick = () => selectNode(b.dataset.go);
  });
}
function clearSel(){ sel = null; paint(); showDetail(overview()); }

function overview(){
  const unk = DATA.edges.filter(e => e.evidence_status === "unknown");
  return `<h2>Overview</h2><p>${esc(DATA.summary)}</p>
    <h3>How to read this</h3>
    <ul><li>Click a box for a module: role, entrypoints, tests, constraints, source evidence.</li>
    <li>Click a line for one relationship and the source lines that prove it.</li>
    <li>The <b>Flows</b> tab traces end-to-end paths and highlights them on the diagram.</li>
    <li>Dashed red lines are relationships with <b>no</b> source evidence &mdash; treated as unknown, not asserted.</li>
    <li>Scroll to zoom, drag to pan, <b>Fit</b> to reset.</li></ul>
    <h3>Counts</h3>
    <ul><li>${DATA.nodes.length} modules (cap ${DATA.node_cap})</li>
    <li>${DATA.edges.length} relationships, ${unk.length} unknown</li>
    <li>${DATA.flows.length} traced flows</li></ul>
    ${!unk.length ? `<p class="hint">Every relationship drawn here resolves to a source line. Nothing is marked unknown in this build.</p>` : ""}
    ${unk.length ? `<h3>Unknown relationships</h3><ul>${unk.map(e =>
      `<li><code>${esc(e.from)} &rarr; ${esc(e.to)}</code> (${e.type})<br><span class="hint">${esc(e.note||"")}</span></li>`).join("")}</ul>` : ""}`;
}

/* ------------------------------------------------------------- tab panes */
pane("nodes").innerHTML = GROUPS.map(g => {
  const list = g.ids.filter(id => byId[id]).map(id => {
    const n = byId[id];
    return `<div class="row" data-go="${esc(id)}"><div class="hd">${esc(id)}</div>
      <div class="sub mono">${esc(n.path)}</div>
      <div class="sub">${esc(n.role.slice(0,120))}${n.role.length>120?"…":""}</div></div>`;
  }).join("");
  return list ? `<h3>${esc(g.label)}</h3>${list}` : "";
}).join("");

pane("flows").innerHTML = DATA.flows.map((f,i) =>
  `<div class="row" data-flow="${i}"><div class="hd">${esc(f.name)}</div>
   <div class="sub">${esc(f.trigger)}</div>
   <div class="sub mono">${f.steps.length} steps</div></div>`).join("");

pane("about").innerHTML = `<h2>About this map</h2>
  <h3>Provenance</h3>
  <ul><li>Commit <code>${esc(DATA.repository.commit)}</code></li>
  <li>Branch <code>${esc(DATA.repository.branch)}</code></li>
  <li>Generated <code>${esc(DATA.generated_at)}</code></li></ul>
  <h3>Rules this map follows</h3>
  <ul>
    <li>At most ${DATA.node_cap} primary modules.</li>
    <li>Every module carries id, path, role, entrypoints, tests, constraints, evidence.</li>
    <li>Relationship types are limited to <code>${DATA.edge_types.join(" | ")}</code>.</li>
    <li>Every relationship without a matching source line is marked <b>unknown</b> rather than guessed.</li>
    <li>Every flow step names a module that exists in this map.</li>
  </ul>
  <h3>Not on this map</h3>
  <p class="hint">Real modules left out to stay within the ${DATA.node_cap}-module cap. They exist; this map just does not draw them.</p>
  <ul>${(DATA.not_mapped||[]).map(m=>`<li><code>${esc(m.path)}</code><br><span class="hint">${esc(m.why)}</span></li>`).join("")}</ul>
  <h3>Companion files</h3>
  <ul><li><code>codemap.json</code> &mdash; the same nodes, edges and flows as data, with evidence.</li>
  <li><code>codemap.lock</code> &mdash; commit, dirty flag, scope, exclusions, and a per-module fingerprint.</li></ul>`;

document.getElementById("legend").innerHTML =
  DATA.edge_types.map(t => `<div><i style="background:var(--${t})"></i>${t}</div>`).join("") +
  `<div><i style="background:var(--unknown)"></i>unknown (dashed)</div>`;

document.getElementById("hdmeta").textContent =
  `${DATA.repository.commit.slice(0,12)} · ${DATA.nodes.length} modules · ` +
  `${DATA.edges.length} edges · ${DATA.flows.length} flows · generated ${DATA.generated_at}`;

document.querySelectorAll("[data-go]").forEach(r => r.onclick = () => selectNode(r.dataset.go));
document.querySelectorAll("[data-flow]").forEach(r => r.onclick = () => selectFlow(DATA.flows[+r.dataset.flow]));

svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
svg.removeAttribute("viewBox");
fit();
showDetail(overview());
</script>
</body>
</html>
